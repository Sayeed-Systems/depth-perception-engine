[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-perception-engine"
version = "1.0.1"
description = "Standalone, ROS-free stereo depth / traversability / obstacle perception library."
readme = "README.md"
# Deliberately the TOML-table form, not the newer SPDX-string form
# (`license = "MIT"`): tested directly (Phase D17) against setuptools
# 70/79/80.9/84 — the table form builds correctly on all four (a bare
# deprecation warning on 79+, silent success on 70), while the string form
# HARD-ERRORS on setuptools 70 ("`project.license` must be valid exactly by
# one definition (2 matches found)") — a real, proven regression on exactly
# the older-setuptools range a `setuptools<80`-constrained build environment
# (e.g. colcon) could resolve to. Do not "modernize" this to the string form
# without re-verifying against the actual minimum setuptools this project
# needs to support — see docs/DPE_V1_PROVIDER_CONTRACT.md's D17 record.
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "MP-01 Project" },
]

# Deliberately opencv-python-headless, not opencv-python: nothing in the
# library ever calls cv2.imshow/waitKey/named window functions, so it has
# no reason to require a GUI-capable OpenCV build. See "examples" below for
# where the GUI dependency actually belongs.
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.7",
]

[project.optional-dependencies]
# NOTE on examples/live_demo.py's cv2.imshow/VideoCapture: opencv-python and
# opencv-python-headless both install the same top-level `cv2` module and
# cannot be installed together. If you need the GUI demo, swap the core
# dependency yourself:
#   pip uninstall opencv-python-headless && pip install opencv-python
# There is deliberately no "examples" extra here that would install both.
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.11",
]
dev = [
    "depth-perception-engine[test]",
]
# No docs build tool is in use today — every file under docs/ is plain,
# directly-readable Markdown (plus a few pre-rendered Graphviz diagrams
# committed as static .svg, not generated at install/build time). This
# extra exists so `pip install -e ".[docs]"` is a stable, always-available
# command rather than something added later as a breaking workflow change
# — see README.md's Development Setup section.
docs = []
# Level 3, Phase E7: examples/visualize_level3.py's only extra dependency.
# Deliberately optional — the core library (src/depth_perception_engine/)
# never imports matplotlib anywhere; only this one examples/ script does.
# `pip install -e .` (no extras) continues to be sufficient for the whole
# library and its test suite, matching every other examples/*.py script's
# existing "core stays minimal, examples/ opts into what it needs" pattern
# (e.g. live_demo.py's opencv-python swap, documented above).
viz = [
    "matplotlib>=3.5",
]
all = [
    "depth-perception-engine[dev,docs,viz]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Defensive, not strictly required today: `pip install -e .` already makes
# depth_perception_engine importable from anywhere via its editable install,
# which is why the full suite already passes without this. Set anyway so
# `pytest`/`python -m pytest` resolves the src-layout package correctly
# even if invoked in an environment where the editable install step was
# skipped or is stale.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
